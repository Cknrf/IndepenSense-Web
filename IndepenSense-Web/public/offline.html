<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndepenSense</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #121621;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .container {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        text-align: center;
        gap: 1rem;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        color: #fb2c36;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.6);
        max-width: 22rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.75rem;
        background: #fb2c36;
        color: #ffffff;
        font-weight: 700;
        border: none;
        border-radius: 1rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M12 3C7.03 3 2.75 5.94 1 10.05L12 21l11-10.95C21.25 5.94 16.97 3 12 3m0 2c3.63 0 7 1.77 9.05 4.6l-.95.94A11.02 11.02 0 0 0 12 7a11.02 11.02 0 0 0-8.1 3.54l-.95-.94A10.98 10.98 0 0 1 12 5m6.63 7.05L12 18.68l-6.63-6.63A9 9 0 0 1 12 9a9 9 0 0 1 6.63 3.05Z"
        />
      </svg>
      <h1>You're offline</h1>
      <p>Connect to the internet to use IndepenSense, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
